server:
  port: ${PORT:8080}

spring:
  application:
    name: jiejie-admin
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jiejie-system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: 3000ms
          max-idle: 4
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.jiejie.common.entity,com.jiejie.system.entity,com.jiejie.file.entity,com.jiejie.gen.entity,com.jiejie.message.entity,com.jiejie.mall.entity,com.jiejie.job.entity,com.jiejie.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0


# ======================== 应用配置 ========================
jiejie:
  # 演示模式配置（此处为开发环境默认值，生产环境请在 application-prod.yml 中配置）
  # true: 开启演示模式，禁止新增、编辑、删除操作
  # false: 关闭演示模式，允许所有操作
  demo-mode: true

# 日志配置
logging:
  level:
    com.jiejie: info
